services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imairuka_production
      POSTGRES_USER: imairuka
      POSTGRES_PASSWORD: imairuka_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imairuka -d imairuka_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - install.env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://imairuka:imairuka_password@db:5432/imairuka_production
      DATABASE_SSLMODE: disable
      ACTIVE_STORAGE_SERVICE: local
      STRIPE_MODE: direct
      ASSUME_SSL: "false"
      FORCE_SSL: "false"
      APP_HOSTS: localhost,127.0.0.1
    ports:
      - "3000:80"
    volumes:
      - app_storage:/rails/storage

volumes:
  postgres_data:
  app_storage:
